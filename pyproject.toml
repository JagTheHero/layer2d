[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layer2d"
version = "1.0.0"
description = "Open, royalty-free 2D layered avatar format (.l2d), WebGL2 Player, browser Studio, and Python rigging toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
qa = ["playwright>=1.40", "pytest>=8.0"]
ai = ["httpx>=0.25"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
